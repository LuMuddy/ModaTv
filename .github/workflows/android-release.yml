name: Release APK

# 触发方式只有两种：推 v* 标签（发版）或在 Actions 页面手动点一次（试跑）。
# 每次 push 都构建会把 Actions 额度烧在没有产物的运行上，而 Release 才是盒子的下载入口。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release 要写 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发版构建被打断比排队更糟

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.9 要求 JDK 17；ubuntu-latest 自带的 JDK 版本会变，显式钉住。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 密钥与热词凭据统一走 local.properties（和本地开发同一条注入路径），
      # 不在 build.gradle.kts 里另开一条环境变量通道：两套来源迟早会分叉。
      # runner 用完即弃，这份文件不会进入任何提交或 artifact。
      - name: 写入 local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HOT_WORDS_APP_ID: ${{ secrets.HOT_WORDS_APP_ID }}
          HOT_WORDS_APP_KEY: ${{ secrets.HOT_WORDS_APP_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret KEYSTORE_BASE64，请在仓库 Settings → Secrets and variables → Actions 里配置"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          : > local.properties
          write_prop() { printf '%s=%s\n' "$1" "$2" >> local.properties; }
          write_prop modatv.keystoreFile "$RUNNER_TEMP/release.jks"
          write_prop modatv.keystorePassword "$KEYSTORE_PASSWORD"
          write_prop modatv.keyAlias "$KEY_ALIAS"
          write_prop modatv.keyPassword "$KEY_PASSWORD"
          write_prop modatv.hotWordsAppId "$HOT_WORDS_APP_ID"
          write_prop modatv.hotWordsAppKey "$HOT_WORDS_APP_KEY"

      - name: 构建 release APK
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # 客户端（data/UpdateSource.kt）从 atom 的 tag 里解析三段数字做版本比较，
            # 形态不对它不会报错、只会静默地认为「已是最新」，所以这里硬拦。
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag 必须是 vX.Y.Z（形如 v1.0.3），当前是 $GITHUB_REF_NAME"
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease \
            "-Pmodatv.versionName=$VERSION" \
            "-Pmodatv.versionCode=$GITHUB_RUN_NUMBER"

      # 签名配置是可选的（本地没密钥也要能编），所以这里必须验：没有这一步，
      # 缺 secrets 时会静默产出一个装不上的 unsigned 包，而 Release 照发不误。
      - name: 校验签名并命名产物
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::没有生成已签名的 $APK，实际产物："
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "ModaTv-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ModaTv-apk
          path: ModaTv-*.apk
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # 名字必须是 tag 本身：客户端从 atom 的 <title> 里剥掉前导 v 得到版本号，
          # 不写 name 就依赖 action 的默认值，默认值变了客户端会静默读不到。
          name: ${{ github.ref_name }}
          files: ModaTv-*.apk
          generate_release_notes: true
