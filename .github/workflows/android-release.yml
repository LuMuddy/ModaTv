name: Release APK

# 触发方式只有两种：推 v* 标签（发版）或在 Actions 页面手动点一次（试跑）。
# 每次 push 都构建会把 Actions 额度烧在没有产物的运行上，而 Release 才是盒子的下载入口。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release 要写 Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发版构建被打断比排队更糟

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是给下面的「生成发版说明」用的：要拿上一个 tag 做比较基准，
      # 浅克隆（默认 depth=1）里既没有历史也没有 tag，git log 会比不出任何东西。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 8.9 要求 JDK 17；ubuntu-latest 自带的 JDK 版本会变，显式钉住。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 不用 android-actions/setup-android：v1.0.1 那次 CI 就死在它那一步
      # （job 记录：第 4 步 failure，第 5 步起全部 skipped，连「写入 local.properties」
      # 都没走到——所以那次失败跟签名密钥无关，Secrets 配没配至今未被验证过）。
      # 日志要登录才能拉，具体原因没有逐行确认，最可能是 runner 把 node20 的 action
      # 强制升到 node24 那波兼容性断裂。ubuntu-latest 镜像自带 Android SDK
      # （ANDROID_HOME 已设、cmdline-tools 在 PATH），直接用 sdkmanager 装组件，
      # 就少一个会随 runner 升级悄悄失效的第三方 action。
      - name: 安装 SDK 组件
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "::error::runner 没有 ANDROID_HOME，镜像变了？"; exit 1; }
          # PATH 里没有就退回 SDK 自带的那份，不靠某个 action 帮忙配 PATH
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          [ -n "$SDKMGR" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          # yes | ... 被 SIGPIPE 收尾，pipefail 下管道会以 141 结束，必须显式兜住
          ( yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null ) || true
          "$SDKMGR" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # 签名密钥统一走 local.properties（和本地开发同一条注入路径），
      # 不在 build.gradle.kts 里另开一条环境变量通道：两套来源迟早会分叉。
      # 热词凭据是代码常量（data/Repo.kt），到这里已经没有需要注入的东西。
      # runner 用完即弃，这份文件不会进入任何提交或 artifact。
      - name: 写入 local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret KEYSTORE_BASE64，请在仓库 Settings → Secrets and variables → Actions 里配置"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          : > local.properties
          write_prop() { printf '%s=%s\n' "$1" "$2" >> local.properties; }
          write_prop modatv.keystoreFile "$RUNNER_TEMP/release.jks"
          write_prop modatv.keystorePassword "$KEYSTORE_PASSWORD"
          write_prop modatv.keyAlias "$KEY_ALIAS"
          write_prop modatv.keyPassword "$KEY_PASSWORD"

      - name: 构建 release APK
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # 客户端（data/UpdateSource.kt）从 atom 的 tag 里解析三段数字做版本比较，
            # 形态不对它不会报错、只会静默地认为「已是最新」，所以这里硬拦。
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag 必须是 vX.Y.Z（形如 v1.0.3），当前是 $GITHUB_REF_NAME"
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # 手动试跑的产物也要跟得上当前开发线：这段小版本号跟着 app/build.gradle.kts
            # 的默认 versionName 一起改，否则试跑出来的包会报一个比线上更旧的版本号。
            VERSION="1.0.1-dev.${GITHUB_RUN_NUMBER}"
          fi

          # versionCode 由版本号推导：major*10000 + minor*100 + patch（v1.0.2 → 10002），
          # 与 app/build.gradle.kts 的本地默认值同一条公式——改公式时两边一起改。
          # 不用 run number：那样手动试跑也占号，发版的号会跳变，也没法拿 tag 在仓库里复算。
          # 每段必须小于 100，否则串段（1.0.100 与 1.1.0 撞号）。
          BASE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          for part in "$MAJOR" "$MINOR" "$PATCH"; do
            case "$part" in
              ''|*[!0-9]*) echo "::error::版本段不是数字：$BASE"; exit 1 ;;
            esac
            if [ "$part" -ge 100 ]; then
              echo "::error::版本段必须小于 100，否则串段撞号：$BASE"; exit 1
            fi
          done
          VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease \
            "-Pmodatv.versionName=$VERSION" \
            "-Pmodatv.versionCode=$VCODE"

      # 签名配置是可选的（本地没密钥也要能编），所以这里必须验：没有这一步，
      # 缺 secrets 时会静默产出一个装不上的 unsigned 包，而 Release 照发不误。
      # 注意判据只剩 apksigner：产物名由 app/build.gradle.kts 的 outputFileName 定死成
      # ModaTv<版本>.apk，未签名包也是这个名字（不再带 -unsigned 后缀，实测），
      # 所以「文件名对不对」只回答「构建出没出包」，签没签只有 apksigner 说了算。
      - name: 校验签名
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/ModaTv${VERSION}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::没有生成 $APK，实际产物："
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ModaTv-apk
          path: app/build/outputs/apk/release/ModaTv*.apk
          if-no-files-found: error

      # 不用 action 的 generate_release_notes：它只列**合并的 PR**，而这个仓库是直接
      # push 到 master、没有 PR，所以生成出来只剩一行 "Full Changelog"，等于没有说明
      # （v1.0.2 就是这样）。改成自己从上一个 tag 起列提交标题。
      # 只写纯文本、不写 markdown 标题和链接：同一份正文既要显示在 Release 页面，
      # 也要经 UpdateSource.stripHtml 显示在电视的更新弹窗里，带 # 和 [](url) 会很怪。
      - name: 生成发版说明
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          PREV="$(git tag --sort=-creatordate | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$GITHUB_SHA"
            FOOT="完整对比：https://github.com/$GITHUB_REPOSITORY/compare/${PREV}...${GITHUB_REF_NAME}"
          else
            # 没有上一个 tag（比如被删了）就只能列最近这些提交，别把整部历史倒出来
            RANGE="$GITHUB_SHA"
            FOOT="全部提交：https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          fi
          {
            echo "$GITHUB_REF_NAME"
            echo
            # ci / docs / style / test 是维护者视角的噪音，用户只关心能用上什么
            git log --no-merges --max-count=30 --pretty='- %s' "$RANGE" \
              | grep -Ev '^- (ci|docs|style|test)(\(|:)' || true
            echo
            echo "$FOOT"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 发布到 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # 名字必须是 tag 本身：客户端从 atom 的 <title> 里剥掉前导 v 得到版本号，
          # 不写 name 就依赖 action 的默认值，默认值变了客户端会静默读不到。
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: app/build/outputs/apk/release/ModaTv*.apk
